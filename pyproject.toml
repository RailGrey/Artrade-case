[project]
name = "artrade"
version = "0.1.0"
description = "ML model for order buyout prediction"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "scikit-learn>=1.4.0",
    "lightgbm>=4.0.0",
    "shap>=0.45.0",
    "pyarrow>=23.0.1",
    "pre-commit>=4.5.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyter>=1.0.0",
]

[tool.uv]
dev-dependencies = [
    "ipykernel>=7.2.0",
    "jupyter>=1.0.0",
]
